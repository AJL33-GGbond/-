<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>信件详情</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✉</span>时间不是忘记，而是放下</a><nav aria-label="主导航"><a href="/">写一封信</a><a href="/letters">我的信箱</a></nav></header>
<main class="workspace detail"><p class="eyebrow">LETTERS · 留给心里的话</p>
    <h1>信件详情</h1>
    <a href="/letters">返回信箱</a>
    <p>时间均为马来西亚时间（UTC+8）。</p>
    <a href="/">写一封信</a>



    <article>
        <hr>

        <p th:if="${letter.status == 'DRAFT'}"><a th:href="@{/letters/{id}/edit(id=${letter.id})}">修改草稿</a></p>
        <p th:if="${letter.status == 'DRAFT'}"><a th:href="@{/letters/{id}/confirm(id=${letter.id})}">准备寄出</a></p>
        <p th:if="${letter.status == 'SENT'}">这封信已寄出，正文已锁定。</p>
        <h2 th:text="|信件编号 #${letter.id}|">信件编号</h2>
        <p th:switch="${letter.status}">状态：
            <span class="status" th:case="'DRAFT'">草稿</span>
            <span class="status sent" th:case="'SENT'">已寄出</span>
            <span th:case="*">未知状态</span>
        </p>
        <p>创建时间：<span th:text="${#temporals.format(letter.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        <p>修改时间：<span th:text="${#temporals.format(letter.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        <p>寄出时间：<span th:text="${letter.sentAt == null ? '尚未寄出' : #temporals.format(letter.sentAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        <p th:text="${letter.content}"
           style="white-space: pre-wrap; overflow-wrap: anywhere;">
            信件正文
        </p>
    </article>
</main><footer class="site-footer"><span>在这里，慢慢写，不必急着说完。</span><span>一封信，一段心事</span></footer></body>
</html>

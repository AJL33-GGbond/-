<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>修改草稿</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✉</span>时间不是忘记，而是放下</a><nav aria-label="主导航"><a href="/">写一封信</a><a href="/letters">我的信箱</a></nav></header>
<main class="workspace "><p class="eyebrow">LETTERS · 留给心里的话</p>
    <section class="paper"><h1>修改草稿</h1>
    <p th:text="|信件编号 #${letter.id}|"></p>
    <p th:if="${message}" th:text="${message}" role="alert"></p>
    <form th:action="@{/letters/{id}/edit(id=${letter.id})}" method="post">
        <label for="content">信的正文</label><br>
        <textarea id="content" name="content" rows="12" required th:text="${content}" ></textarea><br>
        <button type="submit">保存修改</button>
    </form>
    <p><a th:href="@{/letters/{id}(id=${letter.id})}">取消，返回详情</a></p>
</section></main><footer class="site-footer"><span>在这里，慢慢写，不必急着说完。</span><span>一封信，一段心事</span></footer></body>
</html>

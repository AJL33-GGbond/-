<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>确认寄出</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✉</span>时间不是忘记，而是放下</a><nav aria-label="主导航"><a href="/">写一封信</a><a href="/letters">我的信箱</a></nav></header>
<main class="workspace "><p class="eyebrow">LETTERS · 留给心里的话</p>
<section class="paper"><h1>确认寄出</h1>
<p>寄出后不能修改正文。请检查这封信，确认后再寄出。</p>
<p th:text="|信件编号 #${letter.id}|"></p>
<p class="letter-body" th:text="${letter.content}" style="white-space: pre-wrap; overflow-wrap: anywhere;"></p>
<form th:action="@{/letters/{id}/send(id=${letter.id})}" method="post">
    <input type="hidden" name="content" th:value="${letter.content}">
    <button type="submit">确认寄出</button>
</form>
<p><a th:href="@{/letters/{id}(id=${letter.id})}">暂不寄出，返回详情</a></p>
</section></main><footer class="site-footer"><span>在这里，慢慢写，不必急着说完。</span><span>一封信，一段心事</span></footer></body>
</html>

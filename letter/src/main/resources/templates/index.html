<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>时间不是忘记，而是放下</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✉</span>时间不是忘记，而是放下</a><nav aria-label="主导航"><a href="/" aria-current="page">写一封信</a><a href="/letters">我的信箱</a></nav></header>
<main class="workspace "><p class="eyebrow">LETTERS · 留给心里的话</p>
    <section class="paper"><h1>今天，想对你说……</h1>
    <p>在这里，写下那些还没说完的话。</p>

    <form action="/letters" method="post">
        <label for="content">信的正文</label>
        <br>
        <textarea
            id="content"
            name="content"
            rows="12"
            cols="40"
            placeholder="今天，我想对你说……"
            required
        ></textarea>
        <br>
        <button type="submit">保存草稿</button>
    </form>
    <p><a href="/letters">查看我的信箱</a></p>
</section></main><footer class="site-footer"><span>在这里，慢慢写，不必急着说完。</span><span>一封信，一段心事</span></footer></body>
</html>
